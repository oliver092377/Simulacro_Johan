services:
  - type: web
    name: villtecc
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "villtecc.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: villtecc-db
          property: connectionString
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: WHATSAPP_NUMERO
        value: "51916948025"

databases:
  - name: villtecc-db
    plan: free
    databaseName: villtecc
