{% extends "simulacro/base.html" %}

{% block title %}Email Invalido{% endblock %}

{% block content %}
<div class="container">
    <div class="text-center p-5 bg-white rounded-4 shadow" style="max-width: 500px; margin: 60px auto;">
        <i class="bi bi-x-circle-fill text-danger" style="font-size: 4rem;"></i>
        <h2 class="fw-bold text-dark mt-3">Enlace Invalido o Expirado</h2>
        <p class="text-muted mt-3">
            El enlace de verificacion no es valido o ya ha sido utilizado.<br>
            Solicita un nuevo enlace de verificacion.
        </p>
        <a href="{% url 'registro' %}" class="btn btn-danger fw-bold mt-4 px-4" style="background-color: #8b0000;">
            <i class="bi bi-person-plus me-2"></i> Registrarse Nuevamente
        </a>
    </div>
</div>
{% endblock %}
