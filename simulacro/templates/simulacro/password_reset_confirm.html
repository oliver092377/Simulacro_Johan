{% extends "simulacro/base.html" %}

{% block title %}Nueva Contrasena{% endblock %}

{% block content %}
<div class="container">
    <div class="p-5 bg-white rounded-4 shadow" style="max-width: 500px; margin: 60px auto;">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-success" style="font-size: 3rem;"></i>
            <h3 class="fw-bold text-dark mt-2">Establecer Nueva Contrasena</h3>
        </div>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="text-danger small fw-bold mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success w-100 fw-bold" style="padding: 12px;">
                <i class="bi bi-check-lg me-2"></i> Guardar Nueva Contrasena
            </button>
        </form>
    </div>
</div>
{% endblock %}
