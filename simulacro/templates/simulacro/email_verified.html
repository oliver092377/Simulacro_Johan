{% extends "simulacro/base.html" %}

{% block title %}Email Verificado{% endblock %}

{% block content %}
<div class="container">
    <div class="text-center p-5 bg-white rounded-4 shadow" style="max-width: 500px; margin: 60px auto;">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
        <h2 class="fw-bold text-dark mt-3">Cuenta Activada</h2>
        <p class="text-muted mt-3">
            Tu correo ha sido verificado correctamente.<br>
            Ya puedes acceder a los simulacros UNSA.
        </p>
        <a href="{% url 'inicio' %}" class="btn btn-success fw-bold mt-4 px-4">
            <i class="bi bi-house-door me-2"></i> Ir al Inicio
        </a>
    </div>
</div>
{% endblock %}
